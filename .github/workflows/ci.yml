name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read             # CI reads code, pushes nothing — least privilege

concurrency:
  group: ci-${{ github.ref }}
  # Superseding a stale PR run is right; superseding a main run is not. A cancelled
  # run reports "cancelled", not "failure", so nothing surfaces -- the commit lands on
  # main having never passed the gates, and tag-and-release.yml, which publishes only
  # off a SUCCESSFUL CI run, silently skips it.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    runs-on: macos-15          # Apple Silicon (arm64) — matches dev + prod
    # CI has no warm case -- uv sync rebuilds the venv every job -- so the suite
    # runs on the order of a minute here. The cap bounds a hung uv sync / pytest at
    # minutes, not 6h; tests/test_app_ui.py sizes APP_RUN_TIMEOUT to report inside it.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          # Nothing here pushes, so keep the token out of .git/config -- the steps
          # below execute ~100 third-party packages' build and import code.
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          # Pinned deliberately: `uv sync --locked` errors unless uv.lock is exactly
          # what the RUNNING uv would produce, so an unpinned uv lets an upstream
          # release turn a green PR red with no repo change -- and the failure is
          # indistinguishable from a genuinely stale lock. Bump with `uv lock`.
          version: "0.12.19"
          # Keys on the only file that changes the resolution; enable-cache stays absent
          # because `auto` already resolves to on here. Expect little from any of it:
          # setup-uv prunes wheels by default and every dep here IS a wheel, so the cache
          # restores ~2 KB and uv re-downloads all 86 packages anyway (~1s saved). Read
          # CLAUDE.md before "fixing" that with prune-cache: false -- it is a net loss.
          cache-dependency-glob: uv.lock

      - name: Sync (locked)
        run: uv sync --locked        # dev group is synced by default; fails if uv.lock is stale

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run ty check

      - name: Tests
        run: uv run pytest
